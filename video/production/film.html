<!doctype html>
<html><head><meta charset="utf-8">
<title>Doorstep film</title>
<style>
@font-face { font-family: "S"; src: url("/web/dist/brand/fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 400 900; }
@font-face { font-family: "M"; src: url("/web/dist/brand/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
:root { --forest:#153E31; --forest2:#1E5241; --forest3:#0F3027; --lime:#B9F27C; --bg:#F6F7F2; --ink:#171C19; --muted:#5B6960; --line:#DCE3DA; --fm:#A9C2B5; --amber:#C98A1B; --rust:#B4553E; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "S", sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.dark { background: radial-gradient(1400px 900px at 50% 45%, #1A4A3B 0%, var(--forest) 55%, #0E2C23 100%); color: #F6F7F2; }
.light { background: var(--bg); }
.abs { position: absolute; }
.mono { font-family: "M", monospace; font-variant-ligatures: none; }
.cap { font-weight: 760; letter-spacing: -0.005em; text-transform: uppercase; }
.h1 { font-size: 78px; line-height: 1.02; }
.h2 { font-size: 54px; line-height: 1.06; font-weight: 720; letter-spacing: -0.02em; }
.lime { color: var(--lime); }
.forest { color: var(--forest); }
.muted { color: var(--muted); }
.card { background: #fff; border: 1.5px solid var(--line); border-radius: 22px; box-shadow: 0 30px 60px -40px rgba(15,48,39,.35); }
.dcard { background: rgba(246,247,242,.06); border: 1.5px solid rgba(246,247,242,.16); border-radius: 22px; }
.pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; padding: 14px 26px; font-weight: 640; font-size: 28px; white-space: nowrap; }
.token { background: var(--lime); color: #10241C; font-weight: 760; font-size: 28px; border-radius: 999px; padding: 12px 22px; box-shadow: 0 0 0 10px rgba(185,242,124,.16), 0 0 40px rgba(185,242,124,.35); white-space: nowrap; }
.label { font-size: 22px; color: var(--fm); font-weight: 560; }
.tag { position: absolute; left: 60px; bottom: 44px; font-size: 21px; font-weight: 560; padding: 8px 16px; border-radius: 999px; }
.tag.l { color: var(--muted); background: rgba(21,62,49,.06); }
.tag.d { color: var(--fm); background: rgba(246,247,242,.07); }
svg { overflow: visible; }
.row { display: grid; grid-template-columns: 250px 1fr; gap: 20px; padding: 14px 0; border-top: 1.5px dashed var(--line); font-size: 26px; }
.row:first-child { border-top: 0; }
.row .k { color: var(--muted); font-family: "M", monospace; font-size: 24px; }
.row .v { font-family: "M", monospace; font-size: 25px; }
.browser { position: absolute; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 50px 100px -40px rgba(15,48,39,.45), 0 0 0 1.5px var(--line); }
.browser .bar { height: 52px; background: #EEF1EC; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1.5px solid var(--line); }
.browser .bar i { width: 13px; height: 13px; border-radius: 50%; background: #D5DBD3; display: inline-block; }
.browser .bar span { margin-left: 18px; background: #fff; border-radius: 8px; padding: 6px 16px; font-size: 19px; color: var(--muted); font-family: "M", monospace; }
.browser .vp { position: absolute; left: 0; right: 0; top: 52px; bottom: 0; overflow: hidden; }
.browser .vp img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.step { display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 640; color: #A7B0A9; margin-bottom: 34px; }
.step b { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; box-shadow: inset 0 0 0 2.5px #C6CEC5; color: #A7B0A9; }
.step.on { color: var(--ink); } .step.on b { background: var(--forest); color: #fff; box-shadow: none; }
.step.done { color: var(--muted); } .step.done b { background: #DCE8D8; color: var(--forest); box-shadow: none; }
.strike { position: relative; }
.strike::after { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; height: 4px; background: var(--lime); transform-origin: left; transform: scaleX(var(--s, 0)); border-radius: 2px; }
.tile { position: absolute; width: 300px; height: 230px; padding: 30px; border-radius: 24px; background: rgba(246,247,242,.06); border: 1.5px solid rgba(246,247,242,.16); }
.tile h3 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; }
.tile p { margin: 12px 0 0; font-size: 22px; color: var(--fm); line-height: 1.35; }
.tile svg { width: 54px; height: 54px; margin-bottom: 18px; color: var(--lime); }
</style></head>
<body>
<div id="stage"></div>
<script>
// ------------------------------------------------------------------ engine
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const io = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eo = (x) => 1 - Math.pow(1 - x, 3);
const P = (t, t0, d) => clamp((t - t0) / d);
const lerp = (a, b, v) => a + (b - a) * v;
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const show = (el, v, dy = 24, dx = 0) => { el.style.opacity = v; el.style.transform = `translate(${(1 - v) * dx}px, ${(1 - v) * dy}px)`; };
const pos = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
const LOGO = (size, arch = '#fff') => `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#1E5241"/><path class="arch" d="M17 49V27a15.5 15.5 0 0 1 31 0v22" fill="none" stroke="${arch}" stroke-width="4.6" stroke-linecap="round" pathLength="100"/><path class="arrow" d="M6.5 36H31M25 30l6 6-6 6" fill="none" stroke="#B9F27C" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="42.6" cy="45" r="3.6" fill="#B9F27C"/></svg>`;
const MARK = (size, col = '#B9F27C') => `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><path d="M17 49V27a15.5 15.5 0 0 1 31 0v22" fill="none" stroke="#F6F7F2" stroke-width="4.6" stroke-linecap="round"/><path d="M6.5 36H31M25 30l6 6-6 6" fill="none" stroke="${col}" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="42.6" cy="45" r="3.6" fill="${col}"/></svg>`;
const ICON = {
  exchange: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18M12 3l9 5H3z"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg>',
  vault: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M15.5 12H17"/></svg>',
  escrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 7.6-8 9-4.6-1.4-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  invoice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  payroll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><path d="M17 7v6M14 10h6"/></svg>',
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16.5h5"/></svg>',
  refund: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>',
};

const TL = window.TL;
const stage = document.getElementById('stage');
const scenes = {};
function scene(id, cls, build, draw) {
  const s = TL.scenes.find((x) => x.id === id);
  const el = $(`<div class="scene ${cls}" id="s-${id}"></div>`);
  stage.appendChild(el);
  const ctx = build(el, s);
  scenes[id] = { s, el, draw: (lt) => draw(lt, ctx, s.lines.map((l) => l.local), s) };
}
// A small travelling payment token along a polyline
function along(pts, v) {
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let r = v * total;
  for (let i = 0; i < seg.length; i++) { if (r <= seg[i]) { const f = seg[i] ? r / seg[i] : 0; return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)]; } r -= seg[i]; }
  return pts[pts.length - 1];
}
const placeTok = (el, xy, w = 150, h = 56) => { el.style.left = (xy[0] - w / 2) + 'px'; el.style.top = (xy[1] - h / 2) + 'px'; };

// ================================================================== 1. HOOK
scene('hook', 'dark', (el) => {
  const h1 = $(`<div class="abs cap h1" style="left:160px;top:150px;width:1600px">Your money can reach an address.</div>`);
  const h2 = $(`<div class="abs cap h1 lime" style="left:160px;top:248px;width:1760px">But can the app actually receive it?</div>`);
  const ex = $(`<div class="abs dcard" style="left:200px;top:560px;width:420px;height:250px;padding:34px">
     <div style="display:flex;align-items:center;gap:16px;color:var(--fm)"><span style="width:44px;height:44px;color:var(--lime)">${ICON.exchange}</span><span style="font-size:26px;font-weight:600">Exchange account</span></div>
     <div style="font-size:64px;font-weight:760;margin-top:22px;letter-spacing:-0.02em"><span id="exb">250.00</span> <span style="font-size:30px;color:var(--fm)">USDC</span></div>
     <div class="label" style="margin-top:10px">Withdraw · network: Arc</div></div>`);
  const va = $(`<div class="abs dcard" style="left:1240px;top:540px;width:480px;height:290px;padding:34px">
     <div style="display:flex;align-items:center;gap:16px;color:var(--fm)"><span style="width:44px;height:44px;color:var(--lime)">${ICON.vault}</span><span style="font-size:26px;font-weight:600">Savings app · smart contract</span></div>
     <div class="mono" style="font-size:22px;margin-top:26px;color:var(--fm)">accepts: deposit(amount, you)</div>
     <div style="margin-top:22px;font-size:26px;color:var(--fm)">Your balance</div>
     <div style="font-size:52px;font-weight:760;letter-spacing:-0.02em">0.00 <span style="font-size:26px;color:var(--fm)">USDC</span></div></div>`);
  const track = $(`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><path d="M620 685 H1240" stroke="rgba(246,247,242,.25)" stroke-width="3" stroke-dasharray="10 12"/></svg>`);
  const tok = $(`<div class="abs token">25 USDC</div>`);
  const chip = $(`<div class="abs pill" style="left:660px;top:770px;background:rgba(201,138,27,.16);color:#F3D58A;font-size:24px">Arrived as a plain transfer · nobody credited</div>`);
  const tag = $(`<div class="tag d">Illustration</div>`);
  [track, ex, va, tok, h1, h2, chip, tag].forEach((e) => el.appendChild(e));
  return { h1, h2, ex, va, tok, chip, exb: ex.querySelector('#exb') };
}, (t, c, L) => {
  show(c.ex, eo(P(t, 0.1, .8)), 20); show(c.va, eo(P(t, 0.3, .8)), 20);
  show(c.h1, eo(P(t, L[1] - 0.2, .8))); show(c.h2, eo(P(t, L[2] + 1.8, .8)));
  const v = io(P(t, L[1] + 1.6, 3.2));
  c.tok.style.opacity = P(t, L[1] + 1.3, .3);
  c.exb.textContent = t > L[1] + 1.4 ? '225.00' : '250.00';
  placeTok(c.tok, [lerp(560, 1150, v), 685]);
  const bump = P(t, L[2] + 0.4, .5);
  c.va.style.borderColor = bump > 0 ? `rgba(201,138,27,${0.25 + 0.5 * Math.sin(Math.PI * Math.min(1, bump)) })` : '';
  show(c.chip, eo(P(t, L[2] + 0.9, .6)), 14);
});

// ================================================================== 2. FRICTION
scene('friction', 'light', (el) => {
  const h1 = $(`<div class="abs cap h1 forest" style="left:160px;top:150px">Sending USDC is easy.</div>`);
  const h2 = $(`<div class="abs cap h1" style="left:160px;top:640px;width:1700px">Getting it into the right contract is the hard part.</div>`);
  const steps = ['Withdraw from exchange', 'Personal wallet', 'Add the Arc network', 'Open the app', 'Connect wallet', 'Approve', 'Deposit'];
  const wrap = $(`<div class="abs" style="left:160px;top:330px;width:1640px;display:flex;flex-wrap:wrap;gap:22px 16px;align-items:center"></div>`);
  const pills = steps.map((s, i) => {
    const p = $(`<div class="pill" style="background:#fff;border:1.5px solid var(--line);font-size:27px"><span class="mono" style="color:var(--muted);font-size:21px">${i + 1}</span>${s}</div>`);
    wrap.appendChild(p);
    if (i < steps.length - 1) { const a = $(`<span style="color:#B7C0B8;font-size:30px">→</span>`); wrap.appendChild(a); p._a = a; }
    return p;
  });
  [h1, wrap, h2].forEach((e) => el.appendChild(e));
  return { h1, h2, pills, wrap };
}, (t, c, L) => {
  show(c.h1, eo(P(t, 0.1, .8)));
  const t0 = L[1] + 0.3, span = (L[2] - 0.6) - t0;
  c.pills.forEach((p, i) => { const v = eo(P(t, t0 + span * i / c.pills.length, .45)); show(p, v, 16); if (p._a) p._a.style.opacity = eo(P(t, t0 + span * (i + 0.6) / c.pills.length, .3)); });
  const dim = P(t, L[2], .8); c.wrap.style.opacity = 1 - 0.55 * dim; c.wrap.style.filter = `blur(${dim * 1.5}px)`;
  show(c.h2, eo(P(t, L[2] + 0.2, .9)));
});

// ================================================================== 3. INTRO
scene('intro', 'dark', (el) => {
  const logo = $(`<div class="abs" style="left:0;top:0;width:1920px;display:flex;flex-direction:column;align-items:center"></div>`);
  const row = $(`<div style="display:flex;align-items:center;gap:36px">${LOGO(170)}<span style="font-size:150px;font-weight:760;letter-spacing:-0.045em">doorstep</span></div>`);
  const tg = $(`<div style="margin-top:22px;font-size:46px;font-weight:600;color:var(--lime);letter-spacing:-0.01em">Payments that find their way in.</div>`);
  logo.appendChild(row); logo.appendChild(tg);
  const path = $(`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><path id="ip" d="M560 760 H1360" stroke="#B9F27C" stroke-width="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round"/></svg>`);
  const n1 = $(`<div class="abs dcard" style="left:200px;top:690px;width:360px;height:140px;padding:26px;display:flex;gap:18px;align-items:center"><span style="width:52px;height:52px;color:var(--lime)">${ICON.wallet}</span><div><div style="font-size:30px;font-weight:700">Wallet or exchange</div><div class="label">sends USDC to an address</div></div></div>`);
  const n2 = $(`<div class="abs" style="left:885px;top:685px;width:150px;height:150px;border-radius:34px;background:#1E5241;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(185,242,124,.4)">${MARK(104)}</div>`);
  const n3 = $(`<div class="abs dcard" style="left:1360px;top:690px;width:380px;height:140px;padding:26px;display:flex;gap:18px;align-items:center"><span style="width:52px;height:52px;color:var(--lime)">${ICON.vault}</span><div><div style="font-size:30px;font-weight:700">Smart contract</div><div class="label mono" style="font-size:20px">deposit(amount, payer)</div></div></div>`);
  const cr = $(`<div class="abs pill" style="left:1385px;top:860px;background:rgba(185,242,124,.14);color:var(--lime);font-size:24px">Credited to the right person</div>`);
  const tok = $(`<div class="abs token" style="font-size:22px;padding:9px 16px">USDC</div>`);
  [path, n1, n2, n3, tok, cr, logo].forEach((e) => el.appendChild(e));
  return { logo, row, tg, path: path.querySelector('#ip'), n1, n2, n3, cr, tok, arch: row.querySelector('.arch'), arrow: row.querySelector('.arrow'), dot: row.querySelector('.dot') };
}, (t, c, L) => {
  const a = eo(P(t, L[0] - 0.3, 1.1));
  c.arch.style.strokeDasharray = 100; c.arch.style.strokeDashoffset = 100 * (1 - a);
  c.arrow.style.transform = `translateX(${-18 * (1 - eo(P(t, L[0] + .3, .7)))}px)`; c.arrow.style.opacity = P(t, L[0] + .3, .4);
  const d = eo(P(t, L[0] + .8, .5)); c.dot.style.transform = `scale(${d})`; c.dot.style.transformOrigin = '42.6px 45px';
  show(c.row, eo(P(t, L[0] - 0.4, .6)), 0);
  show(c.tg, eo(P(t, L[0] + 1.1, .7)), 14);
  // move the logo up when the path appears
  const up = io(P(t, L[1] - 0.2, 1.0));
  c.logo.style.top = lerp(380, 170, up) + 'px';
  c.row.style.transform = `scale(${lerp(1, 0.72, up)})`;
  [c.n1, c.n2, c.n3].forEach((n, i) => show(n, eo(P(t, L[1] + 0.2 + i * 0.25, .6)), 20));
  const pv = io(P(t, L[1] + 1.4, 2.8));
  c.path.style.strokeDashoffset = 100 * (1 - pv);
  c.tok.style.opacity = pv > 0 && pv < 1 ? 1 : 0; placeTok(c.tok, [lerp(560, 1360, pv), 760], 92, 46);
  show(c.cr, eo(P(t, L[1] + 4.3, .6)), 12);
});

// ================================================================== 4. MECHANISM
const ADDR_A = '0xf962e1bd55Ad7FD2e3E804831e4cc2bDBEa75d54', ADDR_B = '0x50b97b12e90Bc93Cd363De1896A1c31694cE95e9';
scene('mechanism', 'light', (el) => {
  const title = $(`<div class="abs" style="left:120px;top:110px;font-size:30px;font-weight:650;color:var(--muted)">How it works</div>`);
  const names = ['Instructions', 'Address', 'Send', 'Deliver or return'];
  const rail = $(`<div class="abs" style="left:120px;top:200px;width:460px"></div>`);
  const steps = names.map((n, i) => { const s = $(`<div class="step"><b>${i + 1}</b>${n}</div>`); rail.appendChild(s); return s; });
  const card = $(`<div class="abs card" style="left:640px;top:170px;width:1140px;padding:26px 40px">
    <div style="font-size:24px;font-weight:650;color:var(--muted);margin-bottom:6px">Instructions</div>
    <div class="row"><span class="k">contract</span><span class="v">0x3da5…7bB3 <span style="font-family:S;color:var(--muted);font-size:22px">demo savings vault</span></span></div>
    <div class="row"><span class="k">call</span><span class="v">deposit(amount, beneficiary)</span></div>
    <div class="row" id="ben"><span class="k">beneficiary</span><span class="v" id="benv">0xada0…0001</span></div>
    <div class="row"><span class="k">refund to</span><span class="v">0xada0…0001</span></div>
    <div class="row"><span class="k">minimum</span><span class="v">25 USDC</span></div>
    <div class="row"><span class="k">fee limit</span><span class="v">0.01 USDC</span></div>
    <div class="row"><span class="k">deadline</span><span class="v">2027-01-01</span></div>
    <div class="row"><span class="k">reference</span><span class="v">inv-1042</span></div></div>`);
  const rows = [...card.querySelectorAll('.row')];
  const addr = $(`<div class="abs" style="left:640px;top:760px;width:1140px;height:170px;border-radius:22px;background:var(--forest);color:#F6F7F2;padding:28px 40px">
    <div style="display:flex;justify-content:space-between"><span style="font-size:24px;color:var(--fm);font-weight:600">Payment address</span><span class="mono" style="font-size:20px;color:var(--fm)">CREATE2(Doorstep, hash(instructions))</span></div>
    <div class="mono" id="av" style="font-size:40px;margin-top:20px;letter-spacing:-0.01em">${ADDR_A}</div></div>`);

  const word = [L[1] + 0.05, L[1] + 0.85, L[1] + 1.55, L[1] + 2.3, L[2] + 0.2];
  c.tiles.forEach((tl, i) => { show(tl, eo(P(t, word[i], .5)), 26); tl.style.borderColor = i === 4 && t > L[2] + 1 ? 'rgba(185,242,124,.6)' : ''; });
  show(c.mcp, eo(P(t, L[2] + 1.6, .7)), 20);
  show(c.no, eo(P(t, L[2] + 5.0, .6)), 10);
});

// ================================================================== 9. CLOSE
scene('close', 'dark', (el) => {
  const svg = $(`<svg class="abs" style="left:0;top:0" width="1920" height="1080">
    <path id="big" d="M760 760V420a200 200 0 0 1 400 0v340" fill="none" stroke="#F6F7F2" stroke-width="22" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <path id="trail" d="M240 590 H1010" stroke="#B9F27C" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
    <circle id="bigdot" cx="1080" cy="700" r="0" fill="#B9F27C"/></svg>`);
  const lock = $(`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center">
     <div style="display:flex;align-items:center;gap:30px">${LOGO(130)}<span style="font-size:118px;font-weight:760;letter-spacing:-0.045em">doorstep</span></div>
     <div class="cap" style="margin-top:44px;font-size:58px;color:var(--lime)">Payments that find their way in.</div>
     <div id="sec" style="margin-top:28px;font-size:32px;color:#DDE8E0">Live on Arc mainnet. Open source. Built for developers.</div></div>`);
  const links = $(`<div class="abs mono" style="left:0;width:1920px;bottom:90px;display:flex;justify-content:center;gap:70px;font-size:30px;color:#DDE8E0"><span>arcdoorstep.duckdns.org</span><span>github.com/phoenix-2203/doorstep</span></div>`);
  [svg, lock, links].forEach((e) => el.appendChild(e));
  return { big: svg.querySelector('#big'), trail: svg.querySelector('#trail'), dot: svg.querySelector('#bigdot'), svg, lock, sec: lock.querySelector('#sec'), links };
}, (t, c, L) => {
  c.big.style.strokeDashoffset = 100 * (1 - io(P(t, 0.1, 1.6)));
  c.trail.style.strokeDashoffset = 100 * (1 - io(P(t, L[0] + 0.6, 1.6)));
  c.dot.setAttribute('r', 26 * eo(P(t, L[0] + 2.1, .4)));
  const out = io(P(t, L[1] - 0.3, 1.0));
  c.svg.style.opacity = 1 - out; c.svg.style.transform = `scale(${1 - 0.15 * out})`; c.svg.style.transformOrigin = '960px 560px';
  show(c.lock, eo(P(t, L[1] + 0.2, .9)), 20);
  c.sec.style.opacity = eo(P(t, L[1] + 1.6, .7));
  show(c.links, eo(P(t, L[1] + 2.3, .7)), 10);
});

// ------------------------------------------------------------------ seek
window.seek = (T) => {
  for (const { s, el, draw } of Object.values(scenes)) {
    const lt = T - s.start;
    const X = TL.crossfade;
    const vis = lt > -0.01 && lt < s.dur;
    if (!vis) { el.style.opacity = 0; el.style.display = 'none'; continue; }
    el.style.display = 'block';
    const isFirst = s === TL.scenes[0], isLast = s === TL.scenes[TL.scenes.length - 1];
    el.style.opacity = Math.min(isFirst ? 1 : clamp(lt / X), isLast ? 1 : clamp((s.dur - lt) / X));
    draw(lt);
  }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
